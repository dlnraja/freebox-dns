# Freebox dual-DNS stack: dns-libre + dns-secure (plain DNS + DoH)
# Usage: copy .env.example → .env then: docker compose up -d

name: freebox-dns

services:
  unbound:
    image: mvance/unbound:latest
    container_name: dns-unbound
    restart: unless-stopped
    volumes:
      - ./config/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    networks:
      dnsnet:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 -p 53 example.com +time=2 +tries=1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  dns-libre:
    image: adguard/dnsproxy:latest
    container_name: dns-libre
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "${DNS_LIBRE_PORT:-5353}:53/udp"
      - "${DNS_LIBRE_PORT:-5353}:53/tcp"
      - "${DOH_LIBRE_PORT:-8443}:443/tcp"
    volumes:
      - ./config/dnsproxy/dns-libre.yaml:/opt/dnsproxy/config.yaml:ro
      - ./certs:/opt/dnsproxy/certs:ro
    command: ["-c", "/opt/dnsproxy/config.yaml"]
    networks:
      dnsnet:
        ipv4_address: 172.28.0.20
    # dnsproxy has no built-in HTTP health; rely on container status + external scripts/health-check.sh
    healthcheck:
      test: ["CMD-SHELL", "nslookup example.com 127.0.0.1 >/dev/null 2>&1 || exit 0"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 10s

  dns-secure:
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: dns-secure
    restart: unless-stopped
    ports:
      - "${DNS_SECURE_PORT:-5354}:53/udp"
      - "${DNS_SECURE_PORT:-5354}:53/tcp"
      - "${DOH_SECURE_PORT:-8444}:443/tcp"
      - "${BLOCKY_HTTP_PORT:-3080}:4000/tcp"
    volumes:
      - ./config/blocky/config.yml:/app/config.yml:ro
      - ./config/blocky/lists:/app/lists:ro
      - ./certs:/app/certs:ro
    networks:
      dnsnet:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  dnsnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
