# Freebox smart DNS — 4 modes on HOST_IP (local-only, never 0.0.0.0)
#
#   uncensored  dns-libre    :5356 / DoH :8453  → hosts → Unbound → world
#   malware     dns-malware  :5357 / DoH :8445  → hosts → malware lists → Unbound
#   antipub     dns-antipub  :5358 / DoH :8446  → hosts → ads+uBO+anti-adblock → Unbound
#   secure      dns-secure   :5354 / DoH :8444  → hosts → antipub+malware → Unbound
#
# Smart split: LOCAL lists first, then forward via shared Unbound (DoT uncensoring).

name: freebox-dns

services:
  unbound:
    image: mvance/unbound:latest
    container_name: dns-unbound
    restart: unless-stopped
    volumes:
      - ./config/unbound/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf:ro
      - ./config/unbound/a-records.conf:/opt/unbound/etc/unbound/a-records.conf:ro
    networks:
      dnsnet:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "drill -p 53 example.com @127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  dns-libre:
    image: adguard/dnsproxy:latest
    container_name: dns-libre
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "${HOST_IP}:${DNS_LIBRE_PORT:-5356}:53/udp"
      - "${HOST_IP}:${DNS_LIBRE_PORT:-5356}:53/tcp"
      - "${HOST_IP}:${DOH_LIBRE_PORT:-8453}:443/tcp"
      - "${HOST_IP}:${DOT_LIBRE_PORT:-8853}:853/tcp"
      - "${HOST_IP}:${DOQ_LIBRE_PORT:-8853}:853/udp"
    volumes:
      - ./config/dnsproxy/dns-libre.yaml:/opt/dnsproxy/config.yaml:ro
      - ./config/uncensor:/opt/dnsproxy/uncensor:ro
      - ./certs:/opt/dnsproxy/certs:ro
    command: ["--config-path", "/opt/dnsproxy/config.yaml"]
    networks:
      dnsnet:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD-SHELL", "nslookup example.com 127.0.0.1 >/dev/null 2>&1 || exit 0"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 10s

  dns-malware:
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: dns-malware
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "${HOST_IP}:${DNS_MALWARE_PORT:-5357}:53/udp"
      - "${HOST_IP}:${DNS_MALWARE_PORT:-5357}:53/tcp"
      - "${HOST_IP}:${DOH_MALWARE_PORT:-8445}:443/tcp"
      - "${HOST_IP}:${DOT_MALWARE_PORT:-8855}:853/tcp"
    volumes:
      - ./config/blocky/config-malware.yml:/app/config.yml:ro
      - ./config/blocky/lists:/app/lists:ro
      - ./config/uncensor:/app/uncensor:ro
      - ./certs:/app/certs:ro
    networks:
      dnsnet:
        ipv4_address: 172.28.0.31
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  dns-antipub:
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: dns-antipub
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "${HOST_IP}:${DNS_ANTIPUB_PORT:-5358}:53/udp"
      - "${HOST_IP}:${DNS_ANTIPUB_PORT:-5358}:53/tcp"
      - "${HOST_IP}:${DOH_ANTIPUB_PORT:-8446}:443/tcp"
      - "${HOST_IP}:${DOT_ANTIPUB_PORT:-8856}:853/tcp"
    volumes:
      - ./config/blocky/config-antipub.yml:/app/config.yml:ro
      - ./config/blocky/lists:/app/lists:ro
      - ./config/uncensor:/app/uncensor:ro
      - ./certs:/app/certs:ro
    networks:
      dnsnet:
        ipv4_address: 172.28.0.32
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  dns-secure:
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: dns-secure
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/udp"
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/tcp"
      - "${HOST_IP}:${DOH_SECURE_PORT:-8444}:443/tcp"
      - "${HOST_IP}:${DOT_SECURE_PORT:-8854}:853/tcp"
      - "${HOST_IP}:${BLOCKY_HTTP_PORT:-3080}:4000/tcp"
    volumes:
      - ./config/blocky/config.yml:/app/config.yml:ro
      - ./config/blocky/lists:/app/lists:ro
      - ./config/uncensor:/app/uncensor:ro
      - ./certs:/app/certs:ro
    networks:
      dnsnet:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web-check:
    profiles: ["osint"]
    image: lissy93/web-check:latest
    container_name: dns-webcheck
    restart: unless-stopped
    ports:
      - "${HOST_IP}:${WEBCHECK_PORT:-3090}:3000"
    networks:
      dnsnet:
        ipv4_address: 172.28.0.40

networks:
  dnsnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

