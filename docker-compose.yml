# Freebox smart DNS — 4 modes on HOST_IP (local-only, never 0.0.0.0)
#
#   uncensored  dns-libre       :5356 / DoH :8453 / DoT·DoQ :8853 → hosts → Unbound
#   malware     dns-malware     :5357 / DoH :8445 / DoT :8855
#   antipub     dns-antipub     :5358 / DoH :8446 / DoT :8856
#   secure      dns-secure      :5354 / DoH :8444 / DoT :8854
#   dnscrypt-proxy              :5359  plain→DNSCrypt→Quad9 nofilter
#   dnscrypt-libre (profile)    :8443  DNSCrypt server→dns-libre
#
# Smart split: LOCAL lists first, then forward via shared Unbound (DoT uncensoring).
# Transports: Do53 · DoT · DoH · DoQ · DNSCrypt — see docs/encrypted-dns.md

name: freebox-dns

services:
  unbound:
    image: mvance/unbound:latest
    container_name: dns-unbound
    restart: unless-stopped
    volumes:
      - ./config/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
      - ./config/unbound/forward-records.conf:/opt/unbound/etc/unbound/forward-records.conf:ro
      - ./config/unbound/a-records.conf:/opt/unbound/etc/unbound/a-records.conf:ro
      - ./config/unbound/a-records.critical.conf:/opt/unbound/etc/unbound/a-records.critical.conf:ro
      - ./config/unbound/srv-records.conf:/opt/unbound/etc/unbound/srv-records.conf:ro
      - unbound-cache:/opt/unbound/etc/unbound/var
    networks:
      dnsnet:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "drill -p 53 example.com @127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  dns-libre:
    image: adguard/dnsproxy:latest
    container_name: dns-libre
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "${HOST_IP}:${DNS_LIBRE_PORT:-5356}:53/udp"
      - "${HOST_IP}:${DNS_LIBRE_PORT:-5356}:53/tcp"
      - "${HOST_IP}:${DOH_LIBRE_PORT:-8453}:443/tcp"
      - "${HOST_IP}:${DOT_LIBRE_PORT:-8853}:853/tcp"
      - "${HOST_IP}:${DOQ_LIBRE_PORT:-8853}:853/udp"
    volumes:
      - ./config/dnsproxy/dns-libre.yaml:/opt/dnsproxy/config.yaml:ro
      - ./config/uncensor:/opt/dnsproxy/uncensor:ro
      - ./certs:/opt/dnsproxy/certs:ro
    command: ["--config-path", "/opt/dnsproxy/config.yaml"]
    networks:
      dnsnet:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD-SHELL", "nslookup example.com 127.0.0.1 >/dev/null 2>&1 || exit 0"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 10s

  dns-malware:
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: dns-malware
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "${HOST_IP}:${DNS_MALWARE_PORT:-5357}:53/udp"
      - "${HOST_IP}:${DNS_MALWARE_PORT:-5357}:53/tcp"
      - "${HOST_IP}:${DOH_MALWARE_PORT:-8445}:443/tcp"
      - "${HOST_IP}:${DOT_MALWARE_PORT:-8855}:853/tcp"
    volumes:
      - ./config/blocky/config-malware.yml:/app/config.yml:ro
      - ./config/blocky/lists:/app/lists:ro
      - ./config/uncensor:/app/uncensor:ro
      - ./certs:/app/certs:ro
    networks:
      dnsnet:
        ipv4_address: 172.28.0.31
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  dns-antipub:
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: dns-antipub
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "${HOST_IP}:${DNS_ANTIPUB_PORT:-5358}:53/udp"
      - "${HOST_IP}:${DNS_ANTIPUB_PORT:-5358}:53/tcp"
      - "${HOST_IP}:${DOH_ANTIPUB_PORT:-8446}:443/tcp"
      - "${HOST_IP}:${DOT_ANTIPUB_PORT:-8856}:853/tcp"
    volumes:
      - ./config/blocky/config-antipub.yml:/app/config.yml:ro
      - ./config/blocky/lists:/app/lists:ro
      - ./config/uncensor:/app/uncensor:ro
      - ./certs:/app/certs:ro
    networks:
      dnsnet:
        ipv4_address: 172.28.0.32
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  dns-secure:
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: dns-secure
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    ports:
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/udp"
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/tcp"
      - "${HOST_IP}:${DOH_SECURE_PORT:-8444}:443/tcp"
      - "${HOST_IP}:${DOT_SECURE_PORT:-8854}:853/tcp"
      - "${HOST_IP}:${BLOCKY_HTTP_PORT:-3080}:4000/tcp"
    volumes:
      - ./config/blocky/config.yml:/app/config.yml:ro
      - ./config/blocky/lists:/app/lists:ro
      - ./config/blocky/querylog:/app/querylog
      - ./config/uncensor:/app/uncensor:ro
      - ./certs:/app/certs:ro
    networks:
      dnsnet:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # DNSCrypt client path: plain DNS in → DNSCrypt out to Quad9 nofilter (.10)
  dnscrypt-proxy:
    image: klutchell/dnscrypt-proxy:latest
    container_name: dnscrypt-proxy
    restart: unless-stopped
    ports:
      - "${HOST_IP}:${DNSCRYPT_PROXY_PORT:-5359}:53/udp"
      - "${HOST_IP}:${DNSCRYPT_PROXY_PORT:-5359}:53/tcp"
    volumes:
      - ./config/dnscrypt/proxy:/config
    networks:
      dnsnet:
        ipv4_address: 172.28.0.22
    healthcheck:
      test: ["CMD-SHELL", "nslookup example.com 127.0.0.1 >/dev/null 2>&1 || exit 0"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 20s

  # DNSCrypt server path: LAN sdns:// → dns-libre (init: bash scripts/dnscrypt-server-init.sh)
  dnscrypt-libre:
    image: jedisct1/dnscrypt-server:latest
    container_name: dnscrypt-libre
    restart: unless-stopped
    profiles: ["dnscrypt-server"]
    depends_on:
      - dns-libre
    ports:
      - "${HOST_IP}:${DNSCRYPT_LIBRE_PORT:-8443}:443/udp"
      - "${HOST_IP}:${DNSCRYPT_LIBRE_PORT:-8443}:443/tcp"
    volumes:
      - ./config/dnscrypt/keys:/opt/encrypted-dns/etc/keys
    networks:
      dnsnet:
        ipv4_address: 172.28.0.21
    command: ["start"]

  web-check:
    profiles: ["osint"]
    image: lissy93/web-check:latest
    container_name: dns-webcheck
    restart: unless-stopped
    ports:
      - "${HOST_IP}:${WEBCHECK_PORT:-3090}:3000"
    networks:
      dnsnet:
        ipv4_address: 172.28.0.40

networks:
  dnsnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  unbound-cache:
    name: freebox-dns-unbound-cache

