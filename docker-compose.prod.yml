# Production overlay — classic DNS :53 on HOST_IP (local LAN only)
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  dns-libre:
    ports:
      - "${HOST_IP}:53:53/udp"
      - "${HOST_IP}:53:53/tcp"
      - "${HOST_IP}:${DOH_LIBRE_PORT:-8453}:443/tcp"
      - "${HOST_IP}:${DOT_LIBRE_PORT:-853}:853/tcp"
      - "${HOST_IP}:${DOQ_LIBRE_PORT:-853}:853/udp"

  dns-secure:
    ports:
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/udp"
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/tcp"
      - "${HOST_IP}:${DOH_SECURE_PORT:-8444}:443/tcp"
      - "${HOST_IP}:${DOT_SECURE_PORT:-8854}:853/tcp"
      - "${HOST_IP}:${BLOCKY_HTTP_PORT:-3080}:4000/tcp"
