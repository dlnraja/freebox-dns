# Production overlay — classic DNS :53 on HOST_IP (local LAN only)
# Requires free UDP/TCP 53 on the host (stop systemd-resolved / other resolvers first).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  dns-libre:
    ports:
      - "${HOST_IP}:53:53/udp"
      - "${HOST_IP}:53:53/tcp"
      - "${HOST_IP}:${DOH_LIBRE_PORT:-8453}:443/tcp"

  dns-secure:
    # Second personality on alternate port when a single host IP is used.
    # Prefer a second LAN IP (macvlan / Freebox VM eth1) mapped to 53 for true dual DHCP.
    ports:
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/udp"
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/tcp"
      - "${HOST_IP}:${DOH_SECURE_PORT:-8444}:443/tcp"
      - "${HOST_IP}:${BLOCKY_HTTP_PORT:-3080}:4000/tcp"
