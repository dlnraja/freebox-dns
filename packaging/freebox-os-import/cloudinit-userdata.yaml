#cloud-config
# Freebox OS VM all-in-one freebox-dns (API cloudinit_userdata + NoCloud cidata)
hostname: freebox-dns
manage_etc_hosts: true

ssh_pwauth: true
chpasswd:
  expire: false
  users:
    - name: debian
      password: freeboxdns
      type: text

write_files:
  - path: /etc/systemd/system/freebox-dns-bootstrap.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Bootstrap freebox-dns dual stack
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/freebox-dns-bootstrap.sh
      TimeoutStartSec=0

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/sbin/freebox-dns-bootstrap.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euxo pipefail
      exec > >(tee -a /var/log/freebox-dns-bootstrap.log) 2>&1
      date -u
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -y
      apt-get install -y docker.io git curl ca-certificates openssl bind9-dnsutils jq python3
      if [ ! -x /usr/local/lib/docker/cli-plugins/docker-compose ]; then
        mkdir -p /usr/local/lib/docker/cli-plugins
        ARCH=$(dpkg --print-architecture)
        case "$ARCH" in
          arm64|aarch64) COMPOSE_ARCH=aarch64 ;;
          amd64|x86_64) COMPOSE_ARCH=x86_64 ;;
          *) COMPOSE_ARCH=$ARCH ;;
        esac
        curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
          "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-${COMPOSE_ARCH}"
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
      fi
      systemctl enable --now docker
      mkdir -p /opt
      cd /opt
      if [ ! -d freebox-dns/.git ]; then
        rm -rf freebox-dns
        git clone --depth 1 https://github.com/dlnraja/freebox-dns.git freebox-dns
      else
        git -C freebox-dns pull --ff-only || true
      fi
      cd freebox-dns
      cp -n .env.example .env || true
      IP=$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')
      IP=${IP:-$(hostname -I | awk '{print $1}')}
      sed -i "s/^HOST_IP=.*/HOST_IP=${IP}/" .env
      sed -i 's/^DNS_LIBRE_PORT=.*/DNS_LIBRE_PORT=53/' .env
      bash scripts/generate-certs.sh
      chmod 644 certs/server.crt certs/server.key
      python3 scripts/generate-client-profiles.py || true
      COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
      case "$(dpkg --print-architecture)" in
        arm64|aarch64) COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.arm64.yml" ;;
      esac
      docker compose $COMPOSE_FILES pull
      docker compose $COMPOSE_FILES up -d
      python3 scripts/warm-local-cache.py || true
      bash scripts/warm-unbound-runtime.sh || true
      bash scripts/health-check.sh || true
      echo "OK HOST_IP=${IP} DoH=https://${IP}:8453/dns-query"
      echo "LOCAL FIRST: hosts + Unbound local-data/cache, then DoT forwards"
      echo "Client profiles: /opt/freebox-dns/config/clients/generated/"

runcmd:
  - systemctl enable freebox-dns-bootstrap.service
  - /usr/local/sbin/freebox-dns-bootstrap.sh

final_message: |
  freebox-dns VM ready.
  DHCP: DNS1=this-VM-IP DNS2=9.9.9.10 (SOS)
  DoH libre: https://THIS_IP:8453/dns-query
  SSH: debian / freeboxdns (change after first login)
