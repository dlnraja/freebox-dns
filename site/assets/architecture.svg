<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Architecture freebox-dns">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F4F2"/>
      <stop offset="100%" stop-color="#d4ebe6"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" rx="16" fill="url(#bg)" stroke="#0B3D3A" stroke-width="2"/>
  <text x="240" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0B3D3A">Architecture dual DNS</text>
  <!-- Clients -->
  <rect x="180" y="44" width="120" height="36" rx="8" fill="#fff" stroke="#0B3D3A"/>
  <text x="240" y="66" text-anchor="middle" font-size="11" fill="#0B3D3A">Clients LAN</text>
  <!-- Freebox DHCP -->
  <rect x="180" y="96" width="120" height="36" rx="8" fill="#0B3D3A"/>
  <text x="240" y="118" text-anchor="middle" font-size="11" fill="#E8F4F2">Freebox DHCP</text>
  <!-- dns-libre -->
  <rect x="40" y="168" width="120" height="44" rx="8" fill="#fff" stroke="#E07A5F" stroke-width="2"/>
  <text x="100" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#0B3D3A">dns-libre</text>
  <text x="100" y="202" text-anchor="middle" font-size="9" fill="#4a6562">uncensored</text>
  <!-- dns-secure -->
  <rect x="320" y="168" width="120" height="44" rx="8" fill="#fff" stroke="#0B3D3A" stroke-width="2"/>
  <text x="380" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#0B3D3A">dns-secure</text>
  <text x="380" y="202" text-anchor="middle" font-size="9" fill="#4a6562">threat-local</text>
  <!-- Upstreams -->
  <rect x="120" y="248" width="240" height="36" rx="8" fill="#145751"/>
  <text x="240" y="270" text-anchor="middle" font-size="11" fill="#E8F4F2">Amonts DoT non censeurs</text>
  <!-- Arrows -->
  <path d="M240 80v12" stroke="#0B3D3A" stroke-width="2" marker-end="url(#a)"/>
  <path d="M200 132l-60 32" stroke="#E07A5F" stroke-width="2" fill="none"/>
  <path d="M280 132l60 32" stroke="#0B3D3A" stroke-width="2" fill="none"/>
  <path d="M100 212v24" stroke="#E07A5F" stroke-width="2"/>
  <path d="M380 212v24" stroke="#0B3D3A" stroke-width="2"/>
  <path d="M100 236h140" stroke="#145751" stroke-width="2"/>
  <path d="M380 236h-120" stroke="#145751" stroke-width="2"/>
  <!-- DoH badge -->
  <rect x="350" y="44" width="110" height="36" rx="8" fill="#E07A5F" opacity="0.9"/>
  <text x="405" y="60" text-anchor="middle" font-size="9" fill="#fff">DoH :8453/:8444</text>
  <text x="405" y="72" text-anchor="middle" font-size="8" fill="#fff">Navigateurs</text>
</svg>
