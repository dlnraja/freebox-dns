server:
  verbosity: 1
  num-threads: 2
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-udp: yes
  do-tcp: yes
  prefer-ip6: no
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: no
  edns-buffer-size: 1232
  prefetch: yes
  so-rcvbuf: 1m
  private-address: 192.168.0.0/16
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 127.0.0.0/8
  access-control: 127.0.0.0/8 allow
  access-control: 172.28.0.0/24 allow
  access-control: 192.168.0.0/16 allow
  access-control: 10.0.0.0/8 allow
  hide-identity: yes
  hide-version: yes
  auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"
  root-hints: "/opt/unbound/etc/unbound/root.hints"

remote-control:
  control-enable: no

# Recursive resolution — no blocking lists (dns-libre personality).
# Bootstrap via DoT to non-censoring providers if recursion fails on constrained hosts.
forward-zone:
  name: "."
  forward-tls-upstream: yes
  forward-addr: 9.9.9.10@853#dns.quad9.net
  forward-addr: 185.95.218.42@853#dns.digitale-gesellschaft.ch
  forward-addr: 91.239.100.100@853#anycast.uncensoreddns.org
