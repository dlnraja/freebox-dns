# Reference - knfrmity/mvance image ships unbound.conf and includes:
#   a-records.conf          (serve-expired + OONI local-data + include critical)
#   a-records.critical.conf (warm seeds, local-zone typetransparent)
#   forward-records.conf    (DoT catalogue, forward-first: yes)
#   srv-records.conf
#
# Resolution order inside Unbound:
#   1. local-zone / local-data (critical + anti-lie)
#   2. cache + serve-expired (persisted in docker volume unbound-cache)
#   3. DoT forwarders (forward-records.conf)
#   4. root recursion
#
# Edge (dnsproxy/Blocky) answers hosts.* BEFORE querying Unbound.
# See docs/resilience.md
