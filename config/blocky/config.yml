# dns-secure — local ads + malware only (Pi-hole-like), NOT political censorship
# Upstreams = complementary uncensoring DoT (filtering happens HERE, not upstream)

upstreams:
  groups:
    default:
      - tcp-tls:dns.mullvad.net
      - tcp-tls:dns0.eu
      - tcp-tls:dns.digitale-gesellschaft.ch
      - tcp-tls:anycast.uncensoreddns.org
    freebox_fallback:
      # Prefer uncensoring pins; gateway last
      - 91.239.100.100
      - 185.95.218.42
      - 9.9.9.10
      - 192.168.1.254
  strategy: parallel_best
  timeout: 2s

connectIPVersion: v4

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      - https://adaway.org/hosts.txt
      - /app/lists/ads-extra.txt
    malware:
      - https://urlhaus.abuse.ch/downloads/hostfile/
      - https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt
      - /app/lists/malware-extra.txt
  clientGroupsBlock:
    default:
      - ads
      - malware
  blockType: nxDomain
  blockTTL: 6h
  loading:
    refreshPeriod: 12h
    strategy: blocking
    downloads:
      timeout: 60s

caching:
  minTime: 5m
  maxTime: 30m
  prefetching: true

ports:
  dns: 53
  http: 4000
  https: 443

certFile: /app/certs/server.crt
keyFile: /app/certs/server.key

prometheus:
  enable: false

log:
  level: info
  format: text
  privacy: true
