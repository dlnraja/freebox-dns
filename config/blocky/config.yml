# dns-secure — bit: threat-local
# Pi-hole gravity + uBlock Origin DNS equivalents + anti–anti-adblock
# Lexicon: FREEBOX_DNS_4 NextDNS toolkit — WITHOUT cloud / parental / SafeSearch
# Filtering HERE (Blocky), not Quad9 Secured remote — see docs/filtering.md
# Max uncensoring DoT upstreams — catalog: config/upstreams/uncensoring-catalog.json

upstreams:
  groups:
    default:
      - tcp-tls:dns.mullvad.net
      - tcp-tls:open.dns0.eu
      - tcp-tls:dns.digitale-gesellschaft.ch
      - tcp-tls:anycast.uncensoreddns.org
      - tcp-tls:unicast.uncensoreddns.org
      - tcp-tls:dns10.quad9.net
      - tcp-tls:dot1.applied-privacy.net
      - tcp-tls:dot.libredns.gr
      - tcp-tls:eu1.dns.lavate.ch
      - tcp-tls:open.public-rdns.com
      - tcp-tls:dns.radeksprta.eu
      - tcp-tls:uncensored.freedns.controld.com
      - tcp-tls:dns-unfiltered.adguard.com
    freebox_fallback:
      - 91.239.100.100
      - 89.233.43.71
      - 185.95.218.42
      - 185.95.218.43
      - 9.9.9.10
      - 149.112.112.10
      - 194.242.2.2
      - 193.110.81.254
      - 146.255.56.98
      - 116.202.176.26
      - 95.217.25.217
      - 37.27.125.213
      - 80.211.208.74
      - 76.76.2.5
      - 94.140.14.140
      - 192.168.1.254
      - 45.90.28.0
  strategy: parallel_best
  timeout: 2s

connectIPVersion: dual

bootstrapDns:
  - tcp+udp:9.9.9.10
  - tcp+udp:91.239.100.100

# Local truthful hosts BEFORE denylists (anti–DNS menteur / anti-blockpage)
hostsFile:
  sources:
    - /app/uncensor/hosts.critical
    - /app/uncensor/hosts.local
    - /app/uncensor/hosts.generated
  hostsTTL: 24h
  filterLoopback: false

blocking:
  denylists:
    # --- Pi-hole gravity classics (hosts) ---
    pihole:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      - https://adaway.org/hosts.txt
      - https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
      - https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext
      - https://v.firebog.net/hosts/Prigent-Ads.txt
      - /app/lists/ads-extra.txt
    # --- uBlock Origin intelligence at DNS (HaGeZi wildcard = Blocky v0.23+) ---
    # multi ≈ uBO EasyList+EasyPrivacy broom; popupads ≈ Fanboy/uBO annoyances
    ublock:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/multi.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/popupads.txt
      - https://v.firebog.net/hosts/Easyprivacy.txt
      - https://v.firebog.net/hosts/AdguardDNS.txt
      - https://small.oisd.nl/
    # --- Anti–anti-adblock (kill Admiral / Funding Choices / detection CDNs) ---
    anti_adblock:
      - https://v.firebog.net/hosts/Admiral.txt
      - /app/lists/anti-adblock.txt
    # --- Malware / phishing (Pi-hole + uBO malware lists) ---
    malware:
      - https://urlhaus.abuse.ch/downloads/hostfile/
      - https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt
      - https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt
      - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.medium.txt
      - /app/lists/malware-extra.txt
  allowlists:
    # Same exceptions for every group (false-positive safety)
    pihole:
      - /app/lists/allowlist.txt
    ublock:
      - /app/lists/allowlist.txt
    anti_adblock:
      - /app/lists/allowlist.txt
    malware:
      - /app/lists/allowlist.txt
  clientGroupsBlock:
    default:
      - pihole
      - ublock
      - anti_adblock
      - malware
  blockType: nxDomain
  blockTTL: 6h
  loading:
    refreshPeriod: 12h
    strategy: blocking
    concurrency: 4
    downloads:
      timeout: 120s
      attempts: 3

caching:
  minTime: 5m
  maxTime: 24h
  prefetching: true
  cacheTimeNegative: 30m

ports:
  dns: 53
  http: 4000
  https: 443
  tls: 853

certFile: /app/certs/server.crt
keyFile: /app/certs/server.key

prometheus:
  enable: false

log:
  level: info
  format: text
  privacy: true
