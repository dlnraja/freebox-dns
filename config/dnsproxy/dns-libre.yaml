# dns-libre — bit: uncensoring
# Lexicon from FREEBOX_DNS_1 UncensoredDNS + #2 Digitale Gesellschaft + #3 Quad9 Unsecured
# Local anti-lie hosts BEFORE unbound forward — docs/anti-lie-dns.md (OONI-inspired)
# Max upstreams/fallbacks — config/upstreams/uncensoring-catalog.json
---
bootstrap:
  - "9.9.9.10:53"
  - "91.239.100.100:53"
  - "185.95.218.42:53"

listen-addrs:
  # Dual-stack inside container: "::" accepts IPv4+IPv6 on Linux; avoid listing both 0.0.0.0 and ::
  - "::"

listen-ports:
  - 53

https-port:
  - 443

tls-crt: /opt/dnsproxy/certs/server.crt
tls-key: /opt/dnsproxy/certs/server.key

# Local resolution FIRST (A + AAAA) — before any upstream
hosts-file-enabled: true
hosts-files:
  - /opt/dnsproxy/uncensor/hosts.local
  - /opt/dnsproxy/uncensor/hosts.generated

upstream:
