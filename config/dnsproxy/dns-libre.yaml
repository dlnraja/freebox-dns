# dns-libre — bit: uncensoring + RESILIENT (local-first)
# Transports served: plain DNS · DoH · DoT · DoQ (+ HTTP/3 when supported)
# Resolution order:
#   1) hosts.critical / hosts.local / hosts.generated  (project-local)
#   2) unbound (DoT forward-first, then ROOT recursion + serve-expired cache)
#   3) fallback: encrypted DoH/DoT upstreams then plain catalog + Freebox pins
# See docs/encrypted-dns.md · docs/resilience.md
---
bootstrap:
  - "9.9.9.10:53"
  - "91.239.100.100:53"
  - "185.95.218.42:53"

listen-addrs:
  - "::"

listen-ports:
  - 53

# DNS-over-HTTPS (RFC 8484) — container :443 → host DOH_LIBRE_PORT
https-port:
  - 443

# DNS-over-TLS (RFC 7858) — container :853/tcp → host DOT_LIBRE_PORT
tls-port:
  - 853

# DNS-over-QUIC (RFC 9250) — container :853/udp → host DOQ_LIBRE_PORT
quic-port:
  - 853

# Prefer HTTP/3 for DoH when client supports it
http3: true

doh-routes:
  - /dns-query
  - /dns-query/

https-server-name: freebox-dns-libre

tls-crt: /opt/dnsproxy/certs/server.crt
tls-key: /opt/dnsproxy/certs/server.key

# LOCAL FIRST — before any network DNS
hosts-file-enabled: true
hosts-files:
  - /opt/dnsproxy/uncensor/hosts.critical
  - /opt/dnsproxy/uncensor/hosts.local
  - /opt/dnsproxy/uncensor/hosts.generated

# Primary: resilient unbound only
upstream:
  - "172.28.0.10:53"

# Encrypted fallbacks first (if unbound unreachable), then plain pins
fallback:
  - "https://dns.mullvad.net/dns-query"
  - "https://dns.digitale-gesellschaft.ch/dns-query"
  - "https://dns.quad9.net/dns-query"
  - "tls://dns.mullvad.net"
  - "tls://dns.digitale-gesellschaft.ch"
  - "tls://anycast.uncensoreddns.org"
  - "tls://dns10.quad9.net"
  - "tls://open.dns0.eu"
  - "91.239.100.100:53"
  - "89.233.43.71:53"
  - "185.95.218.42:53"
  - "185.95.218.43:53"
  - "9.9.9.10:53"
  - "149.112.112.10:53"
  - "194.242.2.2:53"
  - "193.110.81.254:53"
  - "146.255.56.98:53"
  - "116.202.176.26:53"
  - "95.217.25.217:53"
  - "37.27.125.213:53"
  - "80.211.208.74:53"
  - "76.76.2.5:53"
  - "94.140.14.140:53"
  - "192.168.1.254:53"
  - "45.90.28.0:53"

cache: true
cache-min-ttl: 60
cache-max-ttl: 86400
cache-optimistic: true
ratelimit: 0
timeout: "8s"
verbose: false
