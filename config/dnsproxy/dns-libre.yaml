# dns-libre — bit: uncensoring + RESILIENT (local-first)
# Resolution order:
#   1) hosts.critical / hosts.local / hosts.generated  (project-local)
#   2) unbound (DoT forward-first, then ROOT recursion + serve-expired cache)
#   3) fallback plain uncensoring catalog + Freebox pins
# See docs/resilience.md
---
bootstrap:
  - "9.9.9.10:53"
  - "91.239.100.100:53"
  - "185.95.218.42:53"

listen-addrs:
  - "::"

listen-ports:
  - 53

https-port:
  - 443

tls-crt: /opt/dnsproxy/certs/server.crt
tls-key: /opt/dnsproxy/certs/server.key

# LOCAL FIRST — before any network DNS
hosts-file-enabled: true
hosts-files:
  - /opt/dnsproxy/uncensor/hosts.critical
  - /opt/dnsproxy/uncensor/hosts.local
  - /opt/dnsproxy/uncensor/hosts.generated

# Primary: resilient unbound only
upstream:
  - "172.28.0.10:53"

# Online fallbacks if unbound itself is unreachable
fallback:
  - "91.239.100.100:53"
  - "89.233.43.71:53"
  - "185.95.218.42:53"
  - "185.95.218.43:53"
  - "9.9.9.10:53"
  - "149.112.112.10:53"
  - "194.242.2.2:53"
  - "193.110.81.254:53"
  - "146.255.56.98:53"
  - "116.202.176.26:53"
  - "95.217.25.217:53"
  - "37.27.125.213:53"
  - "80.211.208.74:53"
  - "76.76.2.5:53"
  - "94.140.14.140:53"
  - "192.168.1.254:53"
  - "45.90.28.0:53"

cache: true
cache-min-ttl: 60
cache-max-ttl: 86400
cache-optimistic: true
ratelimit: 0
timeout: "8s"
verbose: false
