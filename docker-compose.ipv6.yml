# IPv6 LAN exposure overlay — use with base compose when HOST_IP6 is set.
#
#   docker compose -f docker-compose.yml -f docker-compose.ipv6.yml up -d

services:
  dns-libre:
    ports:
      - "${HOST_IP}:${DNS_LIBRE_PORT:-5356}:53/udp"
      - "${HOST_IP}:${DNS_LIBRE_PORT:-5356}:53/tcp"
      - "${HOST_IP6}:${DNS_LIBRE_PORT:-5356}:53/udp"
      - "${HOST_IP6}:${DNS_LIBRE_PORT:-5356}:53/tcp"
      - "${HOST_IP}:${DOH_LIBRE_PORT:-8453}:443/tcp"
      - "${HOST_IP6}:${DOH_LIBRE_PORT:-8453}:443/tcp"
      - "${HOST_IP}:${DOT_LIBRE_PORT:-8853}:853/tcp"
      - "${HOST_IP6}:${DOT_LIBRE_PORT:-8853}:853/tcp"
      - "${HOST_IP}:${DOQ_LIBRE_PORT:-8853}:853/udp"
      - "${HOST_IP6}:${DOQ_LIBRE_PORT:-8853}:853/udp"

  dns-secure:
    ports:
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/udp"
      - "${HOST_IP}:${DNS_SECURE_PORT:-5354}:53/tcp"
      - "${HOST_IP6}:${DNS_SECURE_PORT:-5354}:53/udp"
      - "${HOST_IP6}:${DNS_SECURE_PORT:-5354}:53/tcp"
      - "${HOST_IP}:${DOH_SECURE_PORT:-8444}:443/tcp"
      - "${HOST_IP6}:${DOH_SECURE_PORT:-8444}:443/tcp"
      - "${HOST_IP}:${DOT_SECURE_PORT:-8854}:853/tcp"
      - "${HOST_IP6}:${DOT_SECURE_PORT:-8854}:853/tcp"
      - "${HOST_IP}:${BLOCKY_HTTP_PORT:-3080}:4000/tcp"
      - "${HOST_IP6}:${BLOCKY_HTTP_PORT:-3080}:4000/tcp"

networks:
  dnsnet:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
        - subnet: fd00:fb0x:dns::/64
