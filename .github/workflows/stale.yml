name: stale

# Close inactive issues/PRs to limit backlog bitrot.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: true

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: anti-degradation,security
          stale-issue-message: >
            This issue has been marked stale due to inactivity.
            Comment to keep it open, or it will close in 14 days.
          stale-pr-message: >
            This PR has been marked stale due to inactivity.
            Push or comment to keep it open.
          close-issue-message: Closed due to prolonged inactivity.
          close-pr-message: Closed due to prolonged inactivity.
          operations-per-run: 40
