name: link-health

# Remote URL bitrot for docs Pages + gravity sources + DoT hosts listed in catalog.

on:
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "config/blocky/**"
      - "config/upstreams/**"
      - "docs/lan-only.md"
      - ".github/workflows/link-health.yml"

permissions:
  contents: read

concurrency:
  group: link-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check critical remote URLs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, sys
          from pathlib import Path

          soft_fail = []
          hard_fail = []

          # Must always be up — fail the job if any die
          critical = [
              "https://dlnraja.github.io/freebox-dns/",
              "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
              "https://quad9.net/",
              "https://github.com/0xERR0R/blocky",
              "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/multi.txt",
          ]

          soft = [
              "https://v.firebog.net/hosts/Admiral.txt",
          ]
          cat = json.loads(Path("config/upstreams/uncensoring-catalog.json").read_text(encoding="utf-8"))
          for e in cat.get("doh_uncensoring", []):
              u = e.get("url")
              if u:
                  soft.append(u.split("/dns-query")[0] + "/")

          fi = json.loads(Path("config/blocky/lists/filter-intelligence.json").read_text(encoding="utf-8"))
          for group, items in (fi.get("groups") or {}).items():
              for u in items:
                  if isinstance(u, str) and u.startswith("http"):
                      soft.append(u)

          def check(url: str) -> str | None:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "freebox-dns-link-health/1.0"})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      if r.status >= 400:
                          return f"HTTP {r.status}"
                      print("OK", r.status, url[:90])
                      return None
              except Exception as e:
                  print("FAIL", url[:90], type(e).__name__)
                  return type(e).__name__

          seen = set()
          for url in critical:
              if url in seen:
                  continue
              seen.add(url)
              err = check(url)
              if err:
                  hard_fail.append((url, err))

          for url in soft:
              if url in seen:
                  continue
              seen.add(url)
              err = check(url)
              if err:
                  soft_fail.append((url, err))

          if hard_fail:
              print("CRITICAL dead links:", len(hard_fail))
              for u, e in hard_fail:
                  print(" ", e, u)
              sys.exit(1)
          if len(soft_fail) > 8:
              print("Too many soft dead links:", len(soft_fail))
              for u, e in soft_fail[:30]:
                  print(" ", e, u)
              sys.exit(1)
          if soft_fail:
              print("WARN soft failures", len(soft_fail))
              for u, e in soft_fail[:15]:
                  print(" ", e, u)
          print(f"checked={len(seen)} hard_ok soft_fail={len(soft_fail)}")
          PY
