name: freebox-conf-sync

# Path-filtered conf lint — never polls a live Freebox.
# Logic: scripts/ci-conf-lint.py via reusable-conf-lint.yml

on:
  push:
    paths:
      - "config/freebox/**"
      - "config/freebox-dns-snapshot.json"
      - "config/unbound/**"
      - "config/blocky/**"
      - "config/dnsproxy/**"
      - "config/upstreams/**"
      - "config/uncensor/**"
      - "config/dnscrypt/**"
      - "cloud-init/**"
      - "packaging/freebox-vm/**"
      - "packaging/freebox-os-import/**"
      - "docs/dns-analysis.md"
      - "docs/dns-lexicon.md"
      - "docs/dns-pins.md"
      - "docs/freebox.md"
      - "docs/freebox-vm.md"
      - "docs/upstreams-uncensoring.md"
      - "docs/wifi-lan.md"
      - "docs/pihole-parity.md"
      - "docs/lan-only.md"
      - "docs/modes.md"
      - "docs/quad9.md"
      - "docs/safe-freebox-deploy.md"
      - ".env.example"
      - "docker-compose*.yml"
      - "scripts/generate-blocky-modes.py"
      - "scripts/assert-lan-only.py"
      - "scripts/ci-assert-product.py"
      - "scripts/ci-conf-lint.py"
      - ".github/workflows/freebox-conf-sync.yml"
      - ".github/workflows/reusable-conf-lint.yml"
  pull_request:
    paths:
      - "config/freebox/**"
      - "config/freebox-dns-snapshot.json"
      - "config/unbound/**"
      - "config/blocky/**"
      - "config/dnsproxy/**"
      - "config/upstreams/**"
      - "config/uncensor/**"
      - "config/dnscrypt/**"
      - "cloud-init/**"
      - "packaging/freebox-vm/**"
      - "packaging/freebox-os-import/**"
      - "docs/dns-analysis.md"
      - "docs/dns-lexicon.md"
      - "docs/dns-pins.md"
      - "docs/freebox.md"
      - "docs/freebox-vm.md"
      - "docs/upstreams-uncensoring.md"
      - "docs/wifi-lan.md"
      - "docs/pihole-parity.md"
      - "docs/lan-only.md"
      - "docs/modes.md"
      - "docs/quad9.md"
      - "docs/safe-freebox-deploy.md"
      - ".env.example"
      - "docker-compose*.yml"
      - "scripts/generate-blocky-modes.py"
      - "scripts/assert-lan-only.py"
      - "scripts/ci-assert-product.py"
      - "scripts/ci-conf-lint.py"
      - ".github/workflows/freebox-conf-sync.yml"
      - ".github/workflows/reusable-conf-lint.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1"

permissions:
  contents: read

concurrency:
  group: conf-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-conf:
    uses: ./.github/workflows/reusable-conf-lint.yml
