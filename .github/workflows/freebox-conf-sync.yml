name: freebox-conf-sync

# Validates Freebox-oriented confs — never polls a live Freebox.

on:
  push:
    paths:
      - "config/freebox/**"
      - "config/freebox-dns-snapshot.json"
      - "config/unbound/**"
      - "config/blocky/**"
      - "config/dnsproxy/**"
      - "config/upstreams/**"
      - "config/uncensor/**"
      - "cloud-init/**"
      - "packaging/freebox-vm/**"
      - "packaging/freebox-os-import/**"
      - "docs/dns-analysis.md"
      - "docs/dns-lexicon.md"
      - "docs/dns-pins.md"
      - "docs/freebox.md"
      - "docs/freebox-vm.md"
      - "docs/upstreams-uncensoring.md"
      - "docs/wifi-lan.md"
      - "docs/pihole-parity.md"
      - ".env.example"
      - "docker-compose*.yml"
      - "scripts/generate-blocky-modes.py"
      - ".github/workflows/freebox-conf-sync.yml"
  pull_request:
    paths:
      - "config/freebox/**"
      - "config/freebox-dns-snapshot.json"
      - "config/unbound/**"
      - "config/blocky/**"
      - "config/dnsproxy/**"
      - "config/upstreams/**"
      - "config/uncensor/**"
      - "cloud-init/**"
      - "packaging/freebox-vm/**"
      - "packaging/freebox-os-import/**"
      - "docs/dns-analysis.md"
      - "docs/dns-lexicon.md"
      - "docs/dns-pins.md"
      - "docs/freebox.md"
      - "docs/freebox-vm.md"
      - "docs/upstreams-uncensoring.md"
      - "docs/wifi-lan.md"
      - "docs/pihole-parity.md"
      - ".env.example"
      - "docker-compose*.yml"
      - "scripts/generate-blocky-modes.py"
      - ".github/workflows/freebox-conf-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1"

permissions:
  contents: read

concurrency:
  group: conf-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-conf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: YAML / JSON parse + Blocky drift
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          import yaml
          root = pathlib.Path(".")
          json.loads((root / "config/freebox/dhcp-dns.json").read_text(encoding="utf-8"))
          json.loads((root / "config/freebox-dns-snapshot.json").read_text(encoding="utf-8"))
          for y in (
              "config/blocky/config.yml",
              "config/blocky/config-malware.yml",
              "config/blocky/config-antipub.yml",
              "config/dnsproxy/dns-libre.yaml",
              "cloud-init/pi-user-data.yaml",
              "cloud-init/freebox-vm-user-data.yaml",
          ):
              yaml.safe_load((root / y).read_text(encoding="utf-8"))
          fr = (root / "config/unbound/forward-records.conf").read_text(encoding="utf-8")
          for must in ("dns.mullvad.net", "open.dns0.eu", "digitale-gesellschaft", "uncensoreddns", "applied-privacy", "libredns", "lavate", "public-rdns", "radeksprta", "controld", "adguard", "9.9.9.10"):
              assert must in fr, must
          by = (root / "config/blocky/config.yml").read_text(encoding="utf-8")
          assert "denylists" in by and "queryLog:" in by
          assert "pihole:" in by and "ublock:" in by and "anti_adblock:" in by
          assert (root / "config/blocky/lists/anti-adblock.txt").is_file()
          assert (root / "config/blocky/lists/allowlist.txt").is_file()
          snap = json.loads((root / "config/freebox-dns-snapshot.json").read_text(encoding="utf-8"))
          assert snap["local_lexicon"]["dns_libre"]["bit"] == "uncensored"
          assert snap["local_lexicon"]["dns_secure"]["bit"] == "threat-local"
          cat = json.loads((root / "config/upstreams/uncensoring-catalog.json").read_text(encoding="utf-8"))
          assert len(cat["dot_uncensoring"]) >= 10
          assert "sos_plain" in cat
          man = json.loads((root / "packaging/freebox-vm/manifest.json").read_text(encoding="utf-8"))
          assert man["dhcp_recommended"]["dns1"] == "9.9.9.10"
          subprocess.check_call([sys.executable, "scripts/generate-blocky-modes.py"])
          print("conf lint OK")
          PY
          git diff --exit-code -- config/blocky/config.yml config/blocky/config-malware.yml config/blocky/config-antipub.yml \
            || (echo "Blocky drift — regenerate and commit"; exit 1)
      - name: Documented DoH ports match .env.example
        run: |
          set -euo pipefail
          grep -q 'DOH_LIBRE_PORT=8453' .env.example
          grep -q 'DOH_SECURE_PORT=8444' .env.example
          grep -q '8453' docs/freebox.md
          grep -q 'HOST_IP' docker-compose.yml
          grep -q 'open.dns0.eu' config/unbound/forward-records.conf
          grep -q 'querylog' docker-compose.yml
