name: validate-and-health

on:
  push:
    branches: [main, master]
  pull_request:
    paths-ignore:
      - "**.md"
      - "site/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/labels.yml"
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conf-lint:
    uses: ./.github/workflows/reusable-conf-lint.yml

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Copy env
        run: cp .env.example .env
      - name: Validate compose files
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.arm64.yml config -q
          # ipv6 overlay needs HOST_IP6
          HOST_IP6=fd00:fb0d::71 docker compose -f docker-compose.yml -f docker-compose.ipv6.yml config -q
      - name: Assert HOST_IP bind + Blocky drift
        run: |
          set -euo pipefail
          expected_ip=$(grep -E '^HOST_IP=' .env.example | head -1 | cut -d= -f2 | tr -d '[:space:]"'"'"'')
          test -n "$expected_ip"
          out=$(docker compose -f docker-compose.yml config)
          echo "$out" | grep -q "$expected_ip" || (echo "HOST_IP $expected_ip from .env.example missing in compose"; exit 1)
          if echo "$out" | grep -E '0\.0\.0\.0:' ; then
            echo "ERROR: wildcard bind forbidden"; exit 1
          fi
          docker compose -f docker-compose.yml config --services | grep -E 'unbound|dns-libre|dns-malware|dns-antipub|dns-secure'
          python3 scripts/generate-blocky-modes.py
          git diff --exit-code --ignore-cr-at-eol -- config/blocky/config.yml config/blocky/config-malware.yml config/blocky/config-antipub.yml config/blocky/modes.json \
            || (echo "Blocky configs drifted — run: python3 scripts/generate-blocky-modes.py && commit"; exit 1)
          grep -q '172.28.0.10' config/blocky/config.yml
          grep -q 'queryLog:' config/blocky/config.yml
          python3 scripts/assert-lan-only.py

  freebox-conf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Anti-degradation invariants (no network)
        run: ANTI_DEGRADATION_INVARIANTS_ONLY=1 python3 scripts/anti-degradation-check.py
      - name: Validate Freebox snapshot + inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(".")
          snap = json.loads((root / "config/freebox-dns-snapshot.json").read_text(encoding="utf-8"))
          dhcp = json.loads((root / "config/freebox/dhcp-dns.json").read_text(encoding="utf-8"))
          expected = {"9.9.9.10", "194.242.2.2", "94.140.14.140", "45.90.28.0", "192.168.1.254"}
          text = (root / "config/freebox-dns-snapshot.json").read_text(encoding="utf-8")
          missing = [ip for ip in expected if ip not in text]
          if missing:
              print("Missing pins in snapshot:", missing); sys.exit(1)
          for tip in ("91.239.100.100", "185.95.218.42"):
              if tip not in text:
                  print("Missing DoT-only pin note:", tip); sys.exit(1)
          for key in ("fallback_pins_order", "do_not_use_as_primary", "prod_recommended"):
              assert key in dhcp, key
          blob = text + (root / "config/freebox/dhcp-dns.json").read_text(encoding="utf-8")
          if "fbxos.fr" in blob.lower():
              print("Privacy: fbxos.fr must not appear"); sys.exit(1)
          assert snap["local_lexicon"]["dns_libre"]["bit"] == "uncensored"
          print("Freebox conf OK")
          PY
          for f in \
            cloud-init/pi-user-data.yaml \
            cloud-init/freebox-vm-user-data.yaml \
            config/freebox/README.md \
            docs/dns-analysis.md docs/dns-lexicon.md docs/freebox-vm.md \
            docs/upstreams-uncensoring.md docs/wifi-lan.md docs/pihole-parity.md \
            docs/anti-lie-dns.md docs/resilience.md \
            docs/deploy.md docs/deploy-windows.md docs/lan-only.md \
            packaging/freebox-vm/manifest.json packaging/freebox-vm/packages.txt \
            packaging/freebox-vm/install.sh \
            packaging/freebox-os-import/freebox-os-vm.json \
            packaging/freebox-os-import/cloudinit-userdata.yaml \
            packaging/freebox-os-import/IMPORT-FREEBOX-OS.md \
            scripts/ooni-like-anti-lie.py scripts/warm-local-cache.py \
            scripts/warm-unbound-runtime.sh scripts/blocky-refresh-lists.sh \
            config/uncensor/probe-targets.txt config/uncensor/sinkhole-signatures.json \
            config/unbound/a-records.critical.conf docker-compose.ipv6.yml \
            CHANGELOG.md FEATURES.md CONTRIBUTING.md SECURITY.md
          do test -f "$f" || (echo "missing $f"; exit 1); done
          grep -q 'forward-first: yes' config/unbound/forward-records.conf
          grep -q 'a-records.critical.conf' config/unbound/a-records.conf
          grep -q 'serve-expired: yes' config/unbound/a-records.conf
          grep -q 'serve-expired-client-timeout: 0' config/unbound/a-records.conf
          grep -q 'unbound-cache' docker-compose.yml
          grep -q 'unbound.conf:/opt/unbound/etc/unbound/unbound.conf' docker-compose.yml
          grep -qE '^[[:space:]]*include:[[:space:]]+/opt/unbound/etc/unbound/forward-records\.conf' config/unbound/unbound.conf
          grep -q 'local-zone:.*static' config/unbound/a-records.critical.conf
          ! grep -q typetransparent config/unbound/a-records.critical.conf
          grep -q 'OBSOLETE' config/uncensor/blocky-custom-dns.yml
          test -f scripts/verify-unbound-forwards.sh
          bash scripts/verify-unbound-forwards.sh
          python3 scripts/assert-lan-only.py
          grep -q 'hosts.critical' config/dnsproxy/dns-libre.yaml
          python3 -c "import json; c=json.load(open('config/upstreams/uncensoring-catalog.json')); assert len(c['dot_uncensoring'])>=10; assert 'sos_plain' in c"
          python3 -c "import json; j=json.load(open('packaging/freebox-os-import/freebox-os-vm.json')); assert j['vm']['disk_type']=='qcow2'"
          python3 -c "import json; j=json.load(open('config/freebox/dhcp-dns.json')); assert 'anti_lie' in j and 'ipv6' in j"
          python3 scripts/ci-assert-product.py

  upstream-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Check SOS dig + DoT hostnames
        run: |
          set -euo pipefail
          fail=0
          for ip in 9.9.9.10 194.242.2.2 94.140.14.140; do
            echo "DNS SOS $ip"
            if dig @"$ip" example.com +time=3 +tries=1 +short | grep -qE '^[0-9.]+'; then echo OK
            else echo FAIL "$ip"; fail=$((fail+1)); fi
          done
          for ip in 91.239.100.100 185.95.218.42; do
            dig @"$ip" example.com +time=2 +tries=1 +short >/dev/null 2>&1 || echo "WARN soft plain $ip"
          done
          for host in \
            dns.mullvad.net open.dns0.eu dns.digitale-gesellschaft.ch \
            anycast.uncensoreddns.org unicast.uncensoreddns.org dns10.quad9.net \
            dot1.applied-privacy.net dot.libredns.gr eu1.dns.lavate.ch \
            open.public-rdns.com dns.radeksprta.eu \
            uncensored.freedns.controld.com dns-unfiltered.adguard.com
          do
            getent hosts "$host" || fail=$((fail+1))
          done
          if [ "$fail" -gt 5 ]; then exit 1; fi
      - name: Quad9 ops (SOS .10 + DoH HTTP/2)
        run: python3 scripts/quad9-ops-check.py

  blocklist-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # write only used by gated create-pull-request step (schedule/dispatch)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe blocklist URLs
        run: |
          set -euo pipefail
          urls=(
            "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
            "https://adaway.org/hosts.txt"
            "https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt"
            "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"
            "https://v.firebog.net/hosts/Prigent-Ads.txt"
            "https://v.firebog.net/hosts/Easyprivacy.txt"
            "https://v.firebog.net/hosts/AdguardDNS.txt"
            "https://v.firebog.net/hosts/Admiral.txt"
            "https://small.oisd.nl/"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/multi.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/popupads.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.medium.txt"
            "https://urlhaus.abuse.ch/downloads/hostfile/"
            "https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt"
            "https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt"
          )
          test -f config/blocky/lists/anti-adblock.txt
          test -f config/blocky/lists/allowlist.txt
          test -f config/blocky/lists/filter-intelligence.json
          grep -q 'anti_adblock' config/blocky/config.yml
          for u in "${urls[@]}"; do
            code=$(curl -sL -o /tmp/bl -w "%{http_code}" --max-time 60 "$u" || true)
            echo "$u -> HTTP $code"
            test "$code" = "200"
            test -s /tmp/bl
          done
          mkdir -p config/blocky/lists
          date -u +"last_ci_blocklist_probe=%Y-%m-%dT%H:%M:%SZ" > config/blocky/lists/.last-refresh
      - name: Open PR with probe stamp
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: blocklist probe stamp"
          title: "chore: blocklist probe stamp"
          body: |
            Automated blocklist URL probe (validate-and-health).
            All remote gravity sources returned HTTP 200.
          branch: chore/blocklist-stamp
          delete-branch: true
          labels: chore,ci

  smoke-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compose-config, freebox-conf, conf-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare lab env
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^HOST_IP=.*/HOST_IP=127.0.0.1/' .env
          mkdir -p certs config/blocky/querylog
          openssl req -x509 -newkey rsa:2048 -keyout certs/server.key -out certs/server.crt \
            -days 1 -nodes -subj "/CN=freebox-dns-ci"
          chmod 644 certs/server.crt certs/server.key
          HOST_IP=127.0.0.1 python3 scripts/generate-client-profiles.py
          test -f config/clients/generated/endpoints.json
          grep -q '127.0.0.1' config/clients/generated/endpoints.json
      - name: Start stack
        run: docker compose up -d
      - name: Wait healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            unbound_ok=$(docker inspect -f '{{.State.Health.Status}}' dns-unbound 2>/dev/null || echo starting)
            malware_ok=$(docker inspect -f '{{.State.Health.Status}}' dns-malware 2>/dev/null || echo starting)
            antipub_ok=$(docker inspect -f '{{.State.Health.Status}}' dns-antipub 2>/dev/null || echo starting)
            secure_ok=$(docker inspect -f '{{.State.Health.Status}}' dns-secure 2>/dev/null || echo starting)
            echo "try=$i unbound=$unbound_ok malware=$malware_ok antipub=$antipub_ok secure=$secure_ok"
            if [ "$unbound_ok" = healthy ] && [ "$malware_ok" = healthy ] && [ "$antipub_ok" = healthy ] && [ "$secure_ok" = healthy ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=120
          exit 1
      - name: Query smart modes
        run: |
          set -euo pipefail
          for port in 5356 5357 5358 5354; do
            dig @127.0.0.1 -p "$port" example.com +time=5 +tries=3 +short | tee "/tmp/p$port.txt"
            grep -qE '^[0-9.]+' "/tmp/p$port.txt"
          done
          set +e
          dig @127.0.0.1 -p 5358 doubleclick.net +time=5 +tries=2 | tee /tmp/ads.txt
          set -e
          grep -qE 'NXDOMAIN|status: NXDOMAIN' /tmp/ads.txt
      - name: Collect docker logs on failure
        if: failure()
        run: |
          set -euo pipefail
          docker compose logs --no-color > /tmp/compose-full.log 2>&1 || true
          docker compose ps > /tmp/compose-ps.txt 2>&1 || true
      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            /tmp/*.txt
            /tmp/compose-full.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose down -v
