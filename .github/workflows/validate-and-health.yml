name: validate-and-health

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy env
        run: cp .env.example .env
      - name: Validate base compose (local-only binds)
        run: docker compose -f docker-compose.yml config -q
      - name: Validate prod overlay
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Assert HOST_IP bind (no 0.0.0.0 publish)
        run: |
          set -e
          out=$(docker compose -f docker-compose.yml config)
          echo "$out" | grep -q '192.168.1.50' || (echo "HOST_IP missing from published ports"; exit 1)
          # published host IPs must not be wildcard
          if echo "$out" | grep -E 'published:.*"0\.0\.0\.0"|host_ip: null' | grep -qi published; then
            echo "WARN: inspect bind carefully"
          fi
          docker compose -f docker-compose.yml config --services | grep -E 'unbound|dns-libre|dns-malware|dns-antipub|dns-secure'
          test -f config/blocky/config-malware.yml
          test -f config/blocky/config-antipub.yml
          test -f config/blocky/modes.json
          python3 scripts/generate-blocky-modes.py
          grep -q '172.28.0.10' config/blocky/config.yml
          grep -q '172.28.0.10' config/blocky/config-malware.yml

  freebox-conf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Freebox DHCP JSON + snapshot
        run: |
          set -e
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(".")
          snap = json.loads((root / "config/freebox-dns-snapshot.json").read_text(encoding="utf-8"))
          dhcp = json.loads((root / "config/freebox/dhcp-dns.json").read_text(encoding="utf-8"))
          pins = snap.get("dns") or snap.get("pinned_dns") or []
          if isinstance(pins, dict):
              pins = list(pins.values())
          # snapshot may store list under different keys — accept FREEBOX style
          expected = {"9.9.9.10", "194.242.2.2", "94.140.14.140", "45.90.28.0", "192.168.1.254"}
          text = (root / "config/freebox-dns-snapshot.json").read_text(encoding="utf-8")
          missing = [ip for ip in expected if ip not in text]
          if missing:
              print("Missing pins in snapshot:", missing)
              sys.exit(1)
          # DoT-only on FR ISP must remain documented (not used as DHCP SOS)
          for tip in ("91.239.100.100", "185.95.218.42"):
              if tip not in text:
                  print("Missing DoT-only pin note:", tip)
                  sys.exit(1)
          for key in ("fallback_pins_order", "do_not_use_as_primary", "prod_recommended"):
              assert key in dhcp, key
          # privacy: no obvious street / fbxos remote markers
          blob = text + (root / "config/freebox/dhcp-dns.json").read_text(encoding="utf-8")
          for bad in ("fbxos.fr", "uid", "UID"):
              # soft: only fail on fbxos remote domain leak
              pass
          if "fbxos.fr" in blob.lower():
              print("Privacy: fbxos.fr must not appear in public conf")
              sys.exit(1)
          print("Freebox conf OK")
          PY
      - name: Check cloud-init files exist
        run: |
          test -f cloud-init/pi-user-data.yaml
          test -f cloud-init/freebox-vm-user-data.yaml
          test -f config/freebox/README.md
          test -f docs/dns-analysis.md
          test -f docs/dns-lexicon.md
          test -f docs/freebox-vm.md
          test -f docs/upstreams-uncensoring.md
          test -f packaging/freebox-vm/manifest.json
          test -f packaging/freebox-vm/packages.txt
          test -f packaging/freebox-vm/install.sh
          test -f packaging/freebox-os-import/freebox-os-vm.json
          test -f packaging/freebox-os-import/cloudinit-userdata.yaml
          test -f packaging/freebox-os-import/IMPORT-FREEBOX-OS.md
          test -f scripts/ooni-like-anti-lie.py
          test -f config/uncensor/probe-targets.txt
          test -f config/uncensor/sinkhole-signatures.json
          test -f docs/anti-lie-dns.md
          test -f docs/resilience.md
          test -f docker-compose.ipv6.yml
          test -f scripts/warm-local-cache.py
          grep -q 'forward-first: yes' config/unbound/forward-records.conf
          grep -q 'hosts.critical' config/dnsproxy/dns-libre.yaml
          python3 -c "import json; s=json.load(open('config/freebox-dns-snapshot.json')); assert s['local_lexicon']['dns_libre']['bit']=='uncensored'"
          python3 -c "import json; c=json.load(open('config/upstreams/uncensoring-catalog.json')); assert len(c['dot_uncensoring'])>=10; assert len(c['plain_fallback_order'])>=12"
          python3 -c "import json; j=json.load(open('packaging/freebox-os-import/freebox-os-vm.json')); assert j['vm']['disk_type']=='qcow2'; assert j['vm']['memory_mb']==2048"
          python3 -c "import json; j=json.load(open('config/freebox/dhcp-dns.json')); assert 'anti_lie' in j and 'ipv6' in j"

  upstream-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check complementary DoT hosts + Freebox pins
        run: |
          set -e
          fail=0
          # Prefer uncensoring pins; NextDNS is soft-warn only
          # Plain UDP SOS (must resolve); UncensoredDNS/DG are DoT-only on FR ISP
          for ip in 9.9.9.10 194.242.2.2 94.140.14.140; do
            echo "DNS SOS $ip"
            if dig @"$ip" example.com +time=3 +tries=1 +short | grep -qE '^[0-9.]+'; then
              echo OK
            else
              echo FAIL "$ip"
              fail=$((fail+1))
            fi
          done
          for ip in 91.239.100.100 185.95.218.42; do
            echo "DNS DoT-only soft $ip"
            dig @"$ip" example.com +time=2 +tries=1 +short >/dev/null 2>&1 || echo "WARN soft plain $ip (expected on some networks)"
          done
          echo "DNS 45.90.28.0 (NextDNS soft)"
          dig @45.90.28.0 example.com +time=3 +tries=1 +short || true
          for host in \
            dns.mullvad.net open.dns0.eu dns.digitale-gesellschaft.ch \
            anycast.uncensoreddns.org unicast.uncensoreddns.org dns10.quad9.net \
            dot1.applied-privacy.net dot.libredns.gr eu1.dns.lavate.ch \
            open.public-rdns.com dns.radeksprta.eu \
            uncensored.freedns.controld.com dns-unfiltered.adguard.com
          do
            echo "Resolve $host"
            getent hosts "$host" || fail=$((fail+1))
          done
          # Extra plain uncensoring IPs (soft)
          for ip in 89.233.43.71 146.255.56.98 116.202.176.26 95.217.25.217 37.27.125.213 94.140.14.140; do
            dig @"$ip" example.com +time=2 +tries=1 +short >/dev/null 2>&1 || echo "WARN soft $ip"
          done
          if [ "$fail" -gt 5 ]; then exit 1; fi
          python3 -c "import json; c=json.load(open('config/upstreams/uncensoring-catalog.json')); assert len(c['dot_uncensoring'])>=10"

  blocklist-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe blocklist URLs
        run: |
          set -e
          urls=(
            "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
            "https://adaway.org/hosts.txt"
            "https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt"
            "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"
            "https://v.firebog.net/hosts/Prigent-Ads.txt"
            "https://v.firebog.net/hosts/Easyprivacy.txt"
            "https://v.firebog.net/hosts/AdguardDNS.txt"
            "https://v.firebog.net/hosts/Admiral.txt"
            "https://small.oisd.nl/"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/multi.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/popupads.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.medium.txt"
            "https://urlhaus.abuse.ch/downloads/hostfile/"
            "https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt"
            "https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt"
          )
          test -f config/blocky/lists/anti-adblock.txt
          test -f config/blocky/lists/allowlist.txt
          test -f config/blocky/lists/filter-intelligence.json
          grep -q 'anti_adblock' config/blocky/config.yml
          grep -q 'ublock:' config/blocky/config.yml
          grep -q 'pihole:' config/blocky/config.yml
          for u in "${urls[@]}"; do
            code=$(curl -sL -o /tmp/bl -w "%{http_code}" --max-time 60 "$u" || true)
            echo "$u -> HTTP $code"
            test "$code" = "200"
            test -s /tmp/bl
          done
      - name: Write refresh stamp
        run: |
          mkdir -p config/blocky/lists
          date -u +"last_ci_blocklist_probe=%Y-%m-%dT%H:%M:%SZ" > config/blocky/lists/.last-refresh
      - name: Commit stamp if scheduled
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/blocky/lists/.last-refresh
          git diff --staged --quiet || git commit -m "chore: blocklist probe stamp"
          git push || true

  smoke-stack:
    runs-on: ubuntu-latest
    needs: [compose-config, freebox-conf]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare lab env (loopback bind)
        run: |
          cp .env.example .env
          # CI has no LAN Freebox IP — bind to 127.0.0.1 for smoke
          sed -i 's/^HOST_IP=.*/HOST_IP=127.0.0.1/' .env
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -keyout certs/server.key -out certs/server.crt \
            -days 1 -nodes -subj "/CN=freebox-dns-ci"
          # Blocky runs non-root; key must be world-readable inside the container
          chmod 644 certs/server.crt certs/server.key
          bash scripts/generate-client-profiles.py || python3 scripts/generate-client-profiles.py || true
      - name: Start stack
        run: docker compose up -d
      - name: Wait healthy
        run: |
          for i in $(seq 1 60); do
            docker compose ps || true
            unbound_ok=$(docker inspect -f '{{.State.Health.Status}}' dns-unbound 2>/dev/null || echo starting)
            malware_ok=$(docker inspect -f '{{.State.Health.Status}}' dns-malware 2>/dev/null || echo starting)
            antipub_ok=$(docker inspect -f '{{.State.Health.Status}}' dns-antipub 2>/dev/null || echo starting)
            secure_ok=$(docker inspect -f '{{.State.Health.Status}}' dns-secure 2>/dev/null || echo starting)
            echo "try=$i unbound=$unbound_ok malware=$malware_ok antipub=$antipub_ok secure=$secure_ok"
            if [ "$unbound_ok" = healthy ] && [ "$malware_ok" = healthy ] && [ "$antipub_ok" = healthy ] && [ "$secure_ok" = healthy ]; then
              break
            fi
            for c in dns-malware dns-antipub dns-secure; do
              docker logs "$c" --tail=15 2>&1 || true
            done
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=80
          docker inspect -f '{{.Name}} {{.State.Status}} {{.State.Health.Status}}' dns-unbound dns-libre dns-malware dns-antipub dns-secure
      - name: Query smart modes
        run: |
          set -e
          dig @127.0.0.1 -p 5356 example.com +time=5 +tries=3 +short | tee /tmp/libre.txt
          grep -qE '^[0-9.]+' /tmp/libre.txt
          dig @127.0.0.1 -p 5357 example.com +time=5 +tries=3 +short | tee /tmp/malware.txt
          grep -qE '^[0-9.]+' /tmp/malware.txt
          dig @127.0.0.1 -p 5358 example.com +time=5 +tries=3 +short | tee /tmp/antipub.txt
          grep -qE '^[0-9.]+' /tmp/antipub.txt
          dig @127.0.0.1 -p 5354 example.com +time=5 +tries=3 +short | tee /tmp/secure.txt
          grep -qE '^[0-9.]+' /tmp/secure.txt
          # antipub + secure should NXDOMAIN ads
          dig @127.0.0.1 -p 5358 doubleclick.net +time=5 +tries=2 | tee /tmp/ads-antipub.txt || true
          grep -q NXDOMAIN /tmp/ads-antipub.txt || grep -q 'status: NXDOMAIN' /tmp/ads-antipub.txt
          dig @127.0.0.1 -p 5354 fundingchoicesmessages.google.com +time=5 +tries=2 | tee /tmp/antiab.txt || true
          grep -q NXDOMAIN /tmp/antiab.txt || grep -q 'status: NXDOMAIN' /tmp/antiab.txt || true
      - name: Tear down
        if: always()
        run: docker compose down -v

