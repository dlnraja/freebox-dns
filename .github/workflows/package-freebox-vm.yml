name: package-freebox-vm

# Build Freebox OS VM deployable tarball (packages + images manifest + install).
# Never polls a live Freebox.

on:
  push:
    branches: [main, master]
    paths:
      - "packaging/freebox-vm/**"
      - "cloud-init/freebox-vm-user-data.yaml"
      - "docker-compose*.yml"
      - "config/**"
      - "scripts/package-freebox-vm.sh"
      - "docs/freebox-vm.md"
  pull_request:
    paths:
      - "packaging/freebox-vm/**"
      - "cloud-init/**"
      - "docker-compose*.yml"
      - "config/upstreams/**"
      - "scripts/package-freebox-vm.sh"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest + packages
        run: |
          set -e
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("packaging/freebox-vm/manifest.json").read_text())
          assert m["name"] == "freebox-dns-vm"
          assert len(m["docker_images"]) >= 3
          assert len(m["system_packages"]) >= 6
          pkgs = pathlib.Path("packaging/freebox-vm/packages.txt").read_text().splitlines()
          pkgs = [p.strip() for p in pkgs if p.strip() and not p.startswith("#")]
          for p in ("docker.io", "docker-compose-v2", "git"):
              assert p in pkgs, p
          cat = json.loads(pathlib.Path("config/upstreams/uncensoring-catalog.json").read_text())
          assert len(cat["dot_uncensoring"]) >= 10
          assert len(cat["plain_fallback_order"]) >= 12
          print("VM package metadata OK", len(cat["dot_uncensoring"]), "DoT upstreams")
          PY
          test -x packaging/freebox-vm/install.sh || chmod +x packaging/freebox-vm/install.sh scripts/package-freebox-vm.sh
          test -f docs/freebox-vm.md
          test -f cloud-init/freebox-vm-user-data.yaml
      - name: Build tarball
        run: bash scripts/package-freebox-vm.sh "${GITHUB_SHA::7}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebox-dns-vm
          path: dist/freebox-dns-vm-*.tar.gz
          if-no-files-found: error
